<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathBlitz</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --blue:#3B82F6; --blue-dark:#1D4ED8;
  --green:#22C55E; --green-dark:#15803D;
  --red:#EF4444; --amber:#F59E0B;
  --purple:#8B5CF6; --purple-dark:#6D28D9;
  --bg:#F0F4FF; --text:#1E293B; --muted:#64748B; --border:#E2E8F0;
  --radius:16px;
  --shadow:0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 40px rgba(0,0,0,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}
 
/* nav */
.top-nav{background:white;border-bottom:1px solid var(--border);padding:0.85rem 1.1rem;display:flex;align-items:center;gap:0.75rem;flex-shrink:0;}
.nav-back{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--muted);padding:4px 8px;border-radius:8px;font-family:'Nunito',sans-serif;}
.nav-back:hover{background:var(--bg);}
.nav-info{flex:1;}
.nav-title{font-weight:900;font-size:1rem;}
.nav-sub{font-size:0.72rem;color:var(--muted);}
 
/* pick screens */
.pick-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;overflow-y:auto;}
.pick-heading{text-align:center;margin-bottom:1.5rem;}
.pick-heading h2{font-weight:900;font-size:1.6rem;}
.pick-heading p{color:var(--muted);font-size:0.86rem;margin-top:4px;}
 
/* grade screen */
#grade-screen{background:linear-gradient(160deg,#1E3A8A 0%,#3B82F6 60%,#60A5FA 100%);align-items:center;padding:2rem 1rem 3rem;}
.hero{text-align:center;color:white;padding:2rem 0 2rem;}
.hero h1{font-size:clamp(2.8rem,9vw,4.5rem);font-weight:900;line-height:1;text-shadow:0 4px 16px rgba(0,0,0,0.2);}
.hero h1 span{color:#FDE68A;}
.hero p{font-size:1rem;opacity:0.85;margin-top:0.5rem;}
.grade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0.9rem;width:100%;max-width:580px;}
.grade-card{background:white;border-radius:var(--radius);padding:1.25rem 1.4rem;cursor:pointer;box-shadow:var(--shadow);border:2.5px solid transparent;transition:transform 0.14s,box-shadow 0.14s,border-color 0.14s;display:flex;align-items:center;gap:0.9rem;}
.grade-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:rgba(255,255,255,0.8);}
.grade-card:active{transform:scale(0.97);}
.grade-emoji{font-size:2rem;flex-shrink:0;}
.grade-name{font-weight:900;font-size:1rem;}
.grade-desc{font-size:0.75rem;color:var(--muted);margin-top:2px;}
 
/* op cards */
.op-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.9rem;width:100%;max-width:520px;}
.op-card{background:white;border-radius:var(--radius);padding:1.5rem 1rem;cursor:pointer;box-shadow:var(--shadow);border:2.5px solid var(--border);text-align:center;transition:transform 0.14s,box-shadow 0.14s,border-color 0.14s;}
.op-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.op-card:active{transform:scale(0.97);}
.op-symbol{font-size:2.2rem;font-weight:900;margin-bottom:0.35rem;}
.op-name{font-weight:800;font-size:0.95rem;}
.op-pr{font-size:0.72rem;color:var(--muted);margin-top:4px;}
.op-pr .prv{color:var(--amber);font-weight:800;}
.op-stars{font-size:12px;margin-top:4px;}
.op-star{opacity:0.2;}
.op-star.e{opacity:1;}
 
/* mode cards */
.mode-grid{display:grid;grid-template-columns:1fr;gap:1rem;width:100%;max-width:480px;}
.mode-card{background:white;border-radius:var(--radius);padding:1.5rem 1.5rem;cursor:pointer;box-shadow:var(--shadow);border:2.5px solid var(--border);display:flex;gap:1rem;align-items:flex-start;transition:transform 0.14s,box-shadow 0.14s,border-color 0.14s;}
.mode-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.mode-card:active{transform:scale(0.97);}
.mode-card.blitz{border-color:#BFDBFE;background:linear-gradient(135deg,#EFF6FF 0%,#fff 60%);}
.mode-card.master{border-color:#DDD6FE;background:linear-gradient(135deg,#F5F3FF 0%,#fff 60%);}
.mode-icon{font-size:2.2rem;flex-shrink:0;margin-top:2px;}
.mode-body{}
.mode-tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 9px;border-radius:99px;margin-bottom:5px;}
.tag-b{background:#DBEAFE;color:#1E40AF;}
.tag-m{background:#EDE9FE;color:#4C1D95;}
.mode-name{font-weight:900;font-size:1.1rem;margin-bottom:4px;}
.mode-name.blue{color:var(--blue-dark);}
.mode-name.purple{color:var(--purple-dark);}
.mode-desc{font-size:0.8rem;color:var(--muted);line-height:1.45;}
 
/* set grid */
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;width:100%;max-width:520px;}
.set-card{background:white;border-radius:12px;padding:0.8rem 0.4rem;cursor:pointer;box-shadow:var(--shadow);border:2px solid var(--border);text-align:center;transition:transform 0.12s,box-shadow 0.12s,border-color 0.12s;}
.set-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.set-card:active{transform:scale(0.95);}
.set-sym{font-size:1rem;font-weight:900;}
.set-pr{font-size:10px;color:var(--muted);margin-top:3px;}
.set-pr strong{color:var(--amber);}
.set-stars{font-size:11px;margin-top:2px;}
.set-star{opacity:0.2;}
.set-star.e{opacity:1;}
 
/* game screen */
#game-screen{background:var(--bg);}
.game-stats-row{background:white;border-bottom:1px solid var(--border);padding:0.6rem 1rem;display:flex;gap:6px;}
.gs{background:var(--bg);border-radius:10px;padding:5px 8px;text-align:center;flex:1;}
.gs-val{font-weight:900;font-size:1rem;}
.gs-lbl{font-size:9px;color:var(--muted);}
.gs.hl .gs-val{color:var(--blue);}
.gs.hl .gs-val.neg{color:var(--red);}
.gs.hl-p .gs-val{color:var(--purple-dark);}
 
.game-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:1rem 1rem 0.75rem;max-width:480px;margin:0 auto;width:100%;}
 
/* blitz ring */
.timer-ring{position:relative;width:80px;height:80px;margin-bottom:0.85rem;flex-shrink:0;}
.timer-ring svg{transform:rotate(-90deg);}
#blitz-arc{stroke:var(--blue);stroke-linecap:round;transition:stroke 0.3s;}
#blitz-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.6rem;}
 
/* master stopwatch */
.stopwatch{text-align:center;margin-bottom:0.85rem;}
.sw-time{font-weight:900;font-size:2.8rem;letter-spacing:1px;line-height:1;font-variant-numeric:tabular-nums;}
.sw-penalty{font-size:0.8rem;color:var(--red);font-weight:800;min-height:18px;margin-top:2px;}
 
/* blitz score bar */
.blitz-bar-wrap{width:100%;margin-bottom:0.85rem;}
.blitz-bar-lbl{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--muted);margin-bottom:4px;}
.blitz-bar-lbl .bsc{font-weight:900;color:var(--text);font-size:0.9rem;}
.blitz-bar-lbl .bpr strong{color:var(--amber);}
.blitz-bar-bg{height:7px;background:var(--border);border-radius:99px;overflow:hidden;}
#blitz-bar{height:100%;background:var(--green);border-radius:99px;transition:width 0.25s,background 0.3s;}
 
/* master progress bar */
.master-bar-wrap{width:100%;margin-bottom:0.85rem;}
.master-bar-lbl{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--muted);margin-bottom:4px;}
.master-bar-lbl strong{color:var(--text);}
.master-bar-bg{height:7px;background:var(--border);border-radius:99px;overflow:hidden;}
#master-bar{height:100%;background:var(--purple);border-radius:99px;transition:width 0.3s;}
 
/* flashcard */
.flashcard{background:white;border-radius:22px;box-shadow:var(--shadow-lg);width:100%;padding:1.5rem 1.25rem;text-align:center;margin-bottom:0.85rem;border:3px solid transparent;transition:border-color 0.15s;flex-shrink:0;}
.flashcard.cf{border-color:var(--green);}
.flashcard.wf{border-color:var(--red);}
.flashcard.rf{border-color:var(--amber);}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
.flashcard.shake{animation:shake 0.3s ease;}
.flashcard.pop{animation:pop 0.2s ease;}
.q-label{font-size:0.72rem;color:var(--muted);margin-bottom:4px;}
.q-text{font-weight:900;font-size:clamp(1.9rem,9vw,3rem);letter-spacing:-1px;margin-bottom:0.4rem;}
.q-reveal{font-weight:800;font-size:1.25rem;min-height:32px;display:flex;align-items:center;justify-content:center;gap:5px;}
.q-reveal.c{color:var(--green-dark);}
.q-reveal.w{color:var(--red);}
.q-reveal.r{color:var(--amber);}
 
/* input */
.answer-row{display:flex;gap:8px;width:100%;margin-bottom:0.7rem;}
#ans-input{flex:1;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.7rem;text-align:center;padding:0.55rem 0.5rem;border:2.5px solid var(--border);border-radius:14px;outline:none;background:white;color:var(--text);-moz-appearance:textfield;appearance:textfield;transition:border-color 0.15s;}
#ans-input::-webkit-inner-spin-button,#ans-input::-webkit-outer-spin-button{display:none;}
#ans-input:focus{border-color:var(--blue);}
#go-btn{background:var(--blue);color:white;border:none;border-radius:14px;padding:0.55rem 1.15rem;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.05rem;cursor:pointer;transition:background 0.15s,transform 0.1s;}
#go-btn:hover{background:var(--blue-dark);}
#go-btn:active{transform:scale(0.95);}
#go-btn.mp{background:var(--purple);}
#go-btn.mp:hover{background:var(--purple-dark);}
 
/* numpad */
.numpad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;}
.np{background:white;border:1.5px solid var(--border);border-radius:11px;padding:12px 0;font-family:'Nunito',sans-serif;font-weight:700;font-size:1.1rem;cursor:pointer;text-align:center;color:var(--text);user-select:none;transition:background 0.1s;}
.np:hover{background:var(--bg);}
.np:active{transform:scale(0.93);background:var(--border);}
 
/* results */
#results-screen{background:var(--bg);align-items:center;justify-content:center;padding:2rem 1rem;}
.results-card{background:white;border-radius:26px;box-shadow:var(--shadow-lg);padding:2rem 1.75rem;width:100%;max-width:420px;text-align:center;}
.res-tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 10px;border-radius:99px;margin-bottom:0.4rem;}
.tag-rb{background:#DBEAFE;color:#1E40AF;}
.tag-rm{background:#EDE9FE;color:#4C1D95;}
.res-context{font-size:0.8rem;color:var(--muted);margin-bottom:0.15rem;}
.res-big{font-weight:900;font-size:2.2rem;line-height:1;margin:0.35rem 0 0.1rem;}
.res-big.pos{color:var(--green-dark);}
.res-big.neg{color:var(--red);}
.res-big.zer{color:var(--muted);}
.res-big.tim{color:var(--purple-dark);}
.res-sub{font-size:0.82rem;color:var(--muted);margin-bottom:0.35rem;}
.rec-badge{display:inline-block;background:#FEF3C7;color:#92400E;font-weight:800;font-size:0.8rem;padding:3px 12px;border-radius:99px;margin:0.35rem 0;}
.stars-row{display:flex;justify-content:center;gap:7px;margin:0.8rem 0;}
.big-star{font-size:2.8rem;filter:grayscale(1) opacity(0.2);transform:scale(0.85);transition:filter 0.4s,transform 0.4s;}
.big-star.lit{filter:none;transform:scale(1.05);}
@keyframes starPop{0%{transform:scale(0.4)}60%{transform:scale(1.25)}80%{transform:scale(0.95)}100%{transform:scale(1.05)}}
.big-star.bounce{animation:starPop 0.45s cubic-bezier(0.36,0.07,0.19,0.97) forwards;}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0.8rem 0;}
.rs{background:var(--bg);border-radius:11px;padding:0.6rem 0.4rem;}
.rs-val{font-weight:900;font-size:1.2rem;}
.rs-lbl{font-size:10px;color:var(--muted);margin-top:2px;}
.res-msg{font-size:0.86rem;color:var(--muted);margin-bottom:1.2rem;line-height:1.5;}
.res-btns{display:flex;flex-direction:column;gap:8px;}
.btn-p{background:var(--blue);color:white;border:none;border-radius:13px;padding:0.88rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.97rem;cursor:pointer;width:100%;transition:background 0.15s;}
.btn-p:hover{background:var(--blue-dark);}
.btn-p.pur{background:var(--purple);}
.btn-p.pur:hover{background:var(--purple-dark);}
.btn-s{background:var(--bg);color:var(--text);border:1.5px solid var(--border);border-radius:13px;padding:0.78rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.91rem;cursor:pointer;width:100%;}
.btn-s:hover{background:var(--border);}
 
@media(max-width:380px){
  .game-stats-row .gs:nth-child(n+4){display:none;}
  .np{padding:10px 0;}
}
</style>
</head>
<body>
 
<!-- ══ 1. GRADE ══ -->
<div id="grade-screen" class="screen active">
  <div class="hero">
    <h1>Math<span>Blitz</span> &#9889;</h1>
    <p>Pick your grade to get started</p>
  </div>
  <div class="grade-grid" id="grade-grid"></div>
</div>
 
<!-- ══ 2. OPERATION ══ -->
<div id="op-screen" class="screen">
  <div class="top-nav">
    <button class="nav-back" id="op-back">&#8592;</button>
    <div class="nav-info"><div class="nav-title" id="op-nav-title">Choose an operation</div><div class="nav-sub" id="op-nav-sub"></div></div>
  </div>
  <div class="pick-body">
    <div class="op-grid" id="op-grid"></div>
  </div>
</div>
 
<!-- ══ 3. MODE ══ -->
<div id="mode-screen" class="screen">
  <div class="top-nav">
    <button class="nav-back" id="mode-back">&#8592;</button>
    <div class="nav-info"><div class="nav-title" id="mode-nav-title">Choose a mode</div><div class="nav-sub" id="mode-nav-sub"></div></div>
  </div>
  <div class="pick-body">
    <div class="mode-grid" id="mode-grid"></div>
  </div>
</div>
 
<!-- ══ 4. SET (Master It only) ══ -->
<div id="set-screen" class="screen">
  <div class="top-nav">
    <button class="nav-back" id="set-back">&#8592;</button>
    <div class="nav-info"><div class="nav-title" id="set-nav-title">Choose a set</div><div class="nav-sub" id="set-nav-sub"></div></div>
  </div>
  <div class="pick-body">
    <div class="set-grid" id="set-grid"></div>
  </div>
</div>
 
<!-- ══ 5. GAME ══ -->
<div id="game-screen" class="screen">
  <div class="top-nav">
    <button class="nav-back" id="game-back">&#8592;</button>
    <div class="nav-info"><div class="nav-title" id="game-nav-title"></div><div class="nav-sub" id="game-nav-sub"></div></div>
  </div>
  <div class="game-stats-row" id="game-stats-row"></div>
  <div class="game-body">
 
    <!-- Blitz timer (shown in blitz mode) -->
    <div class="timer-ring" id="blitz-timer-wrap">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="34" fill="none" stroke="#E2E8F0" stroke-width="7"/>
        <circle id="blitz-arc" cx="40" cy="40" r="34" fill="none" stroke="#3B82F6" stroke-width="7" stroke-linecap="round" stroke-dasharray="214" stroke-dashoffset="0"/>
      </svg>
      <div id="blitz-num">60</div>
    </div>
 
    <!-- Master stopwatch (shown in master mode) -->
    <div class="stopwatch" id="master-sw-wrap">
      <div class="sw-time" id="sw-time">0:00.0</div>
      <div class="sw-penalty" id="sw-penalty"></div>
    </div>
 
    <!-- Blitz score bar -->
    <div class="blitz-bar-wrap" id="blitz-bar-wrap">
      <div class="blitz-bar-lbl">
        <span>score: <span class="bsc" id="bsc">0</span></span>
        <span class="bpr" id="bpr">PR: <strong>&#8212;</strong></span>
      </div>
      <div class="blitz-bar-bg"><div id="blitz-bar" style="width:0%"></div></div>
    </div>
 
    <!-- Master progress bar -->
    <div class="master-bar-wrap" id="master-bar-wrap">
      <div class="master-bar-lbl">
        <span>progress: <strong id="m-done">0</strong> / <strong id="m-total">0</strong></span>
        <span id="m-misses-lbl">misses: <strong id="m-misses">0</strong></span>
      </div>
      <div class="master-bar-bg"><div id="master-bar" style="width:0%"></div></div>
    </div>
 
    <div class="flashcard" id="flashcard">
      <div class="q-label" id="q-label"></div>
      <div class="q-text" id="q-text"></div>
      <div class="q-reveal" id="q-reveal"></div>
    </div>
 
    <div class="answer-row">
      <input id="ans-input" type="number" inputmode="numeric" placeholder="?" autocomplete="off">
      <button id="go-btn">Go</button>
    </div>
 
    <div class="numpad">
      <button class="np" data-n="7">7</button>
      <button class="np" data-n="8">8</button>
      <button class="np" data-n="9">9</button>
      <button class="np" data-n="del">&#9003;</button>
      <button class="np" data-n="4">4</button>
      <button class="np" data-n="5">5</button>
      <button class="np" data-n="6">6</button>
      <button class="np" data-n="0">0</button>
      <button class="np" data-n="1">1</button>
      <button class="np" data-n="2">2</button>
      <button class="np" data-n="3">3</button>
      <button class="np" data-n="neg">&#8722;</button>
    </div>
  </div>
</div>
 
<!-- ══ 6. RESULTS ══ -->
<div id="results-screen" class="screen">
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem 1rem;">
    <div class="results-card">
      <div class="res-tag" id="res-tag"></div>
      <div class="res-context" id="res-context"></div>
      <div class="res-big" id="res-big"></div>
      <div class="res-sub" id="res-sub"></div>
      <div id="rec-wrap"></div>
      <div class="stars-row">
        <div class="big-star" id="star1">&#11088;</div>
        <div class="big-star" id="star2">&#11088;</div>
        <div class="big-star" id="star3">&#11088;</div>
      </div>
      <div class="res-stats">
        <div class="rs"><div class="rs-val" id="rs1">&#8212;</div><div class="rs-lbl" id="rs1l">accuracy</div></div>
        <div class="rs"><div class="rs-val" id="rs2">&#8212;</div><div class="rs-lbl" id="rs2l">best streak</div></div>
        <div class="rs"><div class="rs-val" id="rs3">&#8212;</div><div class="rs-lbl" id="rs3l">record</div></div>
      </div>
      <div class="res-msg" id="res-msg"></div>
      <div class="res-btns">
        <button class="btn-p" id="again-btn">Go again &#8635;</button>
        <button class="btn-s" id="change-set-btn" style="display:none">Change set</button>
        <button class="btn-s" id="change-mode-btn">Change mode</button>
        <button class="btn-s" id="change-grade-btn">Change grade</button>
      </div>
    </div>
  </div>
</div>
 
<script>
// ══════════════════════════════════════════
// DATA
// ══════════════════════════════════════════
 
var GRADES = [
  { id:'g1', name:'1st Grade', emoji:'&#x1F423;', desc:'Add & subtract to 20',
    ops:[ {id:'g1+',op:'+',name:'Addition',    sym:'+',       bg:'#DBEAFE',tc:'#1E40AF',lo:1,hi:10},
          {id:'g1-',op:'-',name:'Subtraction', sym:'&#8722;', bg:'#FCE7F3',tc:'#9D174D',lo:1,hi:10} ] },
  { id:'g2', name:'2nd Grade', emoji:'&#x1F430;', desc:'Bigger numbers, intro ×',
    ops:[ {id:'g2+',op:'+',name:'Addition',       sym:'+',       bg:'#DBEAFE',tc:'#1E40AF',lo:5,hi:25},
          {id:'g2-',op:'-',name:'Subtraction',    sym:'&#8722;', bg:'#FCE7F3',tc:'#9D174D',lo:5,hi:25},
          {id:'g2x',op:'x',name:'Multiplication', sym:'&times;', bg:'#D1FAE5',tc:'#065F46',lo:2,hi:5} ] },
  { id:'g3', name:'3rd Grade', emoji:'&#x1F98A;', desc:'Times tables & intro ÷',
    ops:[ {id:'g3+',op:'+',name:'Addition',       sym:'+',       bg:'#DBEAFE',tc:'#1E40AF',lo:10,hi:50},
          {id:'g3-',op:'-',name:'Subtraction',    sym:'&#8722;', bg:'#FCE7F3',tc:'#9D174D',lo:10,hi:50},
          {id:'g3x',op:'x',name:'Multiplication', sym:'&times;', bg:'#D1FAE5',tc:'#065F46',lo:2,hi:9},

// ── Generate the set list for an op ──
// Returns array of {key, label, problems[]}
function getSets(op) {
  var sets = [];
  var opChar = op.op;
  var lo = op.lo; var hi = op.hi;
 
  if (opChar === 'x') {
    // x2 through x12 (or up to hi)
    var maxFact = Math.min(12, hi);
    var minFact = Math.max(2, lo);
    for (var f = minFact; f <= maxFact; f++) {
      var probs = [];
      for (var n = 0; n <= 12; n++) {
        probs.push({text: n + ' \u00d7 ' + f + ' =', ans: n * f});
      }
      sets.push({key: op.id + '_x' + f, label: '\u00d7' + f, problems: shuffle(probs)});
    }
  } else if (opChar === '/') {
    var maxDiv = Math.min(12, hi);
    var minDiv = Math.max(2, lo);
    for (var d = minDiv; d <= maxDiv; d++) {
      var probs2 = [];
      for (var n2 = 0; n2 <= 12; n2++) {
        probs2.push({text: (n2 * d) + ' \u00f7 ' + d + ' =', ans: n2});
      }
      sets.push({key: op.id + '_/'+d, label: '\u00f7' + d, problems: shuffle(probs2)});
    }
  } else if (opChar === '+') {
    // add sets: +1 through +hi (capped 12), each n+(set) for n=0..12
    var maxAdd = Math.min(12, hi);
    var minAdd = Math.max(1, lo);
    for (var a = minAdd; a <= maxAdd; a++) {
      var probs3 = [];
      for (var n3 = 0; n3 <= 12; n3++) {
        probs3.push({text: n3 + ' + ' + a + ' =', ans: n3 + a});
      }
      sets.push({key: op.id + '_+'+a, label: '+' + a, problems: shuffle(probs3)});
    }
  } else if (opChar === '-') {
    // subtract sets: e.g. -9 means n-9 where result >= 0
    // set key = the subtrahend. range: lo..hi (or 1..12)
    var maxSub = Math.min(12, hi);
    var minSub = Math.max(1, lo);
    for (var s = minSub; s <= maxSub; s++) {
      var probs4 = [];
      // n - s >= 0  =>  n >= s
      for (var n4 = s; n4 <= s + 12; n4++) {
        probs4.push({text: n4 + ' \u2212 ' + s + ' =', ans: n4 - s});
      }
      sets.push({key: op.id + '_-'+s, label: '\u2212' + s, problems: shuffle(probs4)});
    }
  }
  return sets;
}

// STORAGE

function store() {
  try { return JSON.parse(localStorage.getItem('mb4') || '{}'); } catch(e) { return {}; }
}
function saveStore(s) { localStorage.setItem('mb4', JSON.stringify(s)); }
 
function getPR(key)    { return store()['pr_'+key]    || 0; }
function getStars(key) { return store()['st_'+key]    || 0; }
 
function recordPR(key, val, stars) {
  var s = store();
  var old = s['pr_'+key] || 0;
  var isNew = val > old;
  if (isNew) s['pr_'+key] = val;
  if (stars > (s['st_'+key]||0)) s['st_'+key] = stars;
  saveStore(s);
  return isNew;
}

function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
 
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length-1; i > 0; i--) {
    var j = randInt(0, i);
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
 
function showScreen(id) {
  var all = document.querySelectorAll('.screen');
  for (var i=0;i<all.length;i++) all[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
 
function fmtTime(secs) {
  var m = Math.floor(secs / 60);
  var s = secs % 60;
  var ds = Math.floor((secs - Math.floor(secs)) * 10);
  return m + ':' + (Math.floor(s)<10?'0':'') + Math.floor(s) + '.' + ds;
}

// ══════════════════════════════════════════
 
function makeBlitzQ() {
  var op=selOp.op, lo=selOp.lo, hi=selOp.hi, a, b, ans;
  if (op==='+') { a=randInt(lo,hi); b=randInt(lo,hi); ans=a+b; return {text:a+' + '+b+' =',ans:ans}; }
  if (op==='-') { a=randInt(lo,hi); b=randInt(lo,a);  ans=a-b; return {text:a+' \u2212 '+b+' =',ans:ans}; }
  if (op==='x') { a=randInt(lo,hi); b=randInt(1,12);  ans=a*b; return {text:a+' \u00d7 '+b+' =',ans:ans}; }
  b=randInt(lo,hi); ans=randInt(1,12); a=b*ans; return {text:a+' \u00f7 '+b+' =',ans:ans};
}
 
function startBlitz() {
  blitzScore=0; blitzRight=0; blitzWrong=0; blitzStreak=0; blitzBest=0;
  blitzTime=60; answered=false;
  clearInterval(blitzHandle);
  blitzPRtarget = Math.max(getPR('blitz_'+selOp.id), 15);
 
  // Show/hide UI elements
  show('blitz-timer-wrap'); hide('master-sw-wrap');
  show('blitz-bar-wrap');   hide('master-bar-wrap');
  document.getElementById('go-btn').className = '';
  document.getElementById('game-nav-title').textContent = selOp.name+' \u2014 '+selGrade.name;
  document.getElementById('game-nav-sub').textContent = 'Blitz \u2014 60 seconds';
 
  // Stats bar: score | correct | wrong | streak
  var sb = document.getElementById('game-stats-row');
  sb.innerHTML =
    '<div class="gs hl"><div class="gs-val" id="gs-score">0</div><div class="gs-lbl">score</div></div>'+
    '<div class="gs"><div class="gs-val" id="gs-right" style="color:var(--green-dark)">0</div><div class="gs-lbl">correct</div></div>'+
    '<div class="gs"><div class="gs-val" id="gs-wrong2" style="color:var(--red)">0</div><div class="gs-lbl">wrong</div></div>'+
    '<div class="gs"><div class="gs-val" id="gs-streak">0</div><div class="gs-lbl">streak</div></div>';
 
  document.getElementById('blitz-arc').style.strokeDashoffset='0';
  document.getElementById('blitz-arc').style.stroke='#3B82F6';
  document.getElementById('blitz-num').textContent='60';
  document.getElementById('bsc').textContent='0';
  var pr=getPR('blitz_'+selOp.id);
  document.getElementById('bpr').innerHTML = pr>0?'PR: <strong>'+pr+'</strong>':'PR: <strong>\u2014</strong>';
  document.getElementById('blitz-bar').style.width='0%';
  document.getElementById('blitz-bar').style.background='var(--green)';
 
  showScreen('game-screen');
  loadBlitzQ();
  document.getElementById('ans-input').focus();
}
 
function loadBlitzQ() {
  currentQ = makeBlitzQ();
  answered = false;
  document.getElementById('q-label').textContent = '';
  document.getElementById('q-text').textContent = currentQ.text;
  document.getElementById('q-reveal').textContent='';
  document.getElementById('q-reveal').className='q-reveal';
  document.getElementById('flashcard').className='flashcard';
  document.getElementById('ans-input').value='';
  if (!blitzHandle) startBlitzTimer();
  document.getElementById('ans-input').focus();
}
 
function startBlitzTimer() {
  var circ=214;
  blitzHandle = setInterval(function(){
    blitzTime -= 0.08;
    if (blitzTime <= 0) { blitzTime=0; clearInterval(blitzHandle); blitzHandle=null; endBlitz(); return; }
    var pct = blitzTime/60;
    document.getElementById('blitz-arc').style.strokeDashoffset = circ*(1-pct);
    document.getElementById('blitz-num').textContent = Math.ceil(blitzTime);
    document.getElementById('blitz-arc').style.stroke = pct<0.25?'#EF4444':pct<0.5?'#F59E0B':'#3B82F6';
  }, 80);
}
 
function submitBlitz() {
  if (answered) return;
  var val = parseInt(document.getElementById('ans-input').value, 10);
  if (isNaN(val)) { document.getElementById('ans-input').focus(); return; }
  answered = true;
 
  var ok = val === currentQ.ans;
  var fc = document.getElementById('flashcard');
  var rv = document.getElementById('q-reveal');
 
  if (ok) {
    blitzRight++; blitzScore++; blitzStreak++;
    if (blitzStreak>blitzBest) blitzBest=blitzStreak;
    fc.className='flashcard cf pop';
    rv.textContent='Correct! +1'; rv.className='q-reveal c';
  } else {
    blitzWrong++; blitzScore--; blitzStreak=0;
    fc.className='flashcard wf shake';
    rv.innerHTML=currentQ.ans+' &nbsp; \u22121'; rv.className='q-reveal w';
  }
 
  // update stats
  var scoreEl = document.getElementById('gs-score');
  if (scoreEl) { scoreEl.textContent=blitzScore; scoreEl.className='gs-val'+(blitzScore<0?' neg':''); }
  setTextSafe('gs-right', blitzRight);
  setTextSafe('gs-wrong2', blitzWrong);
  setTextSafe('gs-streak', blitzStreak);
  document.getElementById('bsc').textContent=blitzScore;
  var pct=Math.max(0,Math.min(100,Math.round(blitzScore/blitzPRtarget*100)));
  document.getElementById('blitz-bar').style.width=pct+'%';
  document.getElementById('blitz-bar').style.background=blitzScore<0?'var(--red)':blitzScore>=blitzPRtarget?'var(--amber)':'var(--green)';
 
  setTimeout(loadBlitzQ, ok ? 350 : 900);
}
 
function endBlitz() {
  clearInterval(blitzHandle); blitzHandle=null;
  var total=blitzRight+blitzWrong;
  var acc=total>0?Math.round(blitzRight/total*100):0;
  var stars=calcBlitzStars(blitzScore);
  var isNew=recordPR('blitz_'+selOp.id, blitzScore, stars);
  renderOps();
 
  document.getElementById('res-tag').className='res-tag tag-rb';
  document.getElementById('res-tag').textContent='BLITZ';
  document.getElementById('res-context').textContent=selOp.name+' \u2014 '+selGrade.name;
 
  var big=document.getElementById('res-big');
  big.textContent=(blitzScore>0?'+':'')+blitzScore;
  big.className='res-big '+(blitzScore>0?'pos':blitzScore<0?'neg':'zer');
  document.getElementById('res-sub').innerHTML='<span style="color:var(--green-dark);font-weight:800;">+'+blitzRight+' correct</span> &nbsp; <span style="color:var(--red);font-weight:800;">\u2212'+blitzWrong+' wrong</span>';
 
  document.getElementById('rec-wrap').innerHTML=isNew&&blitzScore>0?'<div class="rec-badge">&#127942; New personal record!</div>':'';
 
  document.getElementById('rs1').textContent=acc+'%'; document.getElementById('rs1l').textContent='accuracy';
  document.getElementById('rs2').textContent=blitzBest; document.getElementById('rs2l').textContent='best streak';
  var currentPR=getPR('blitz_'+selOp.id);
  document.getElementById('rs3').textContent=currentPR>0?currentPR:'\u2014'; document.getElementById('rs3l').textContent='your record';
 
  setMsg(stars, 'blitz');
  animStars(stars);
  document.getElementById('again-btn').className='btn-p';
  document.getElementById('change-set-btn').style.display='none';
  showScreen('results-screen');
}
 
function calcBlitzStars(score) {
  var bm={'g1+':[ 8,14,20],'g1-':[ 6,12,18],
          'g2+':[ 8,14,20],'g2-':[ 6,12,18],'g2x':[ 6,10,16],
          'g3+':[ 8,14,20],'g3-':[ 6,12,18],'g3x':[ 8,12,18],'g3/':[ 6,10,16],
          'g4+':[ 6,12,18],'g4-':[ 6,12,18],'g4x':[ 8,12,18],'g4/':[ 6,10,16],
          'g5+':[ 4, 8,14],'g5-':[ 4, 8,14],'g5x':[ 6,10,16],'g5/':[ 4, 8,14]};
  var b=bm[selOp.id]||[6,10,16];
  return score>=b[2]?3:score>=b[1]?2:score>=b[0]?1:0;
}

function loadMasterQ() {
  currentQ = masterQueue[0];
  answered = false;
  document.getElementById('q-label').textContent = masterIsRetry ? 'Try again \u2014 you missed this one!' : (masterDone+1)+' of '+masterTotalQ;
  document.getElementById('q-text').textContent = currentQ.text;
  document.getElementById('q-reveal').textContent='';
  document.getElementById('q-reveal').className='q-reveal';
  document.getElementById('flashcard').className = masterIsRetry ? 'flashcard rf' : 'flashcard';
  document.getElementById('ans-input').value='';
  if (!masterRunning) { masterRunning=true; masterStart=Date.now(); startMasterTimer(); }
  document.getElementById('ans-input').focus();
}
 
function startMasterTimer() {
  masterHandle = setInterval(function(){
    masterElapsed = (Date.now()-masterStart)/1000;
    var total = masterElapsed + masterPenalty;
    document.getElementById('sw-time').textContent = fmtTime(total);
    setTextSafe('gs-mtime', fmtTime(total));
  }, 100);
}
 
function submitMaster() {
  if (answered) return;
  var val=parseInt(document.getElementById('ans-input').value, 10);
  if (isNaN(val)) { document.getElementById('ans-input').focus(); return; }
  answered=true;
 
  var ok = val===currentQ.ans;
  var fc=document.getElementById('flashcard');
  var rv=document.getElementById('q-reveal');
 
  if (ok) {
    masterDone++;
    masterStreak++;
    if (masterStreak>masterBest) masterBest=masterStreak;
    masterIsRetry=false;
    masterQueue.shift(); // remove from front — done
    fc.className='flashcard cf pop';
    rv.textContent='Correct!'; rv.className='q-reveal c';
 
    // update progress
    document.getElementById('m-done').textContent=masterDone;
    document.getElementById('master-bar').style.width=Math.round(masterDone/masterTotalQ*100)+'%';
    setTextSafe('gs-mstreak', masterStreak);
 
    if (masterQueue.length===0) {
      setTimeout(endMaster, 600);
    } else {
      setTimeout(loadMasterQ, 400);
    }
  } else {
    masterMisses++;
    masterPenalty+=5;
    masterStreak=0;
    masterIsRetry=true;
    fc.className='flashcard wf shake';
    rv.innerHTML='+5 sec penalty \u2014 try again!'; rv.className='q-reveal w';
 
    document.getElementById('m-misses').textContent=masterMisses;
    setTextSafe('gs-mmiss', masterMisses);
    setTextSafe('gs-mpen', '+'+masterPenalty+'s');
    setTextSafe('gs-mstreak', 0);
 
    // flash penalty on stopwatch
    document.getElementById('sw-penalty').textContent='+5 sec penalty!';
    setTimeout(function(){ document.getElementById('sw-penalty').textContent=''; }, 1200);
 
    setTimeout(loadMasterQ, 1000);
  }
}
 
function endMaster() {
  clearInterval(masterHandle); masterHandle=null; masterRunning=false;
  var finalTime = masterElapsed + masterPenalty;
  var finalTenths = Math.round(finalTime * 10); // store as tenths for PR comparison (lower=better)
 
  // For master mode, lower time = better. PR = lowest time (stored as tenths, display inverted)
  var oldPRtenths = getPR('master_'+selSet.key); // 0 = no record
  var isNew = (oldPRtenths===0) || (finalTenths < oldPRtenths);
  var stars = calcMasterStars(finalTime, masterMisses, masterTotalQ);
  if (isNew) {
    var s2=store(); s2['pr_'+'master_'+selSet.key]=finalTenths;
    if (stars>(s2['st_'+'master_'+selSet.key]||0)) s2['st_'+'master_'+selSet.key]=stars;
    saveStore(s2);
  }
  renderSets();
 
  document.getElementById('res-tag').className='res-tag tag-rm';
  document.getElementById('res-tag').textContent='MASTER IT';
  document.getElementById('res-context').textContent=selOp.name+' '+selSet.label+' \u2014 '+selGrade.name;
 
  var big=document.getElementById('res-big');
  big.textContent=fmtTime(finalTime);
  big.className='res-big tim';
  document.getElementById('res-sub').textContent=masterTotalQ+' problems \u2014 '+masterMisses+' miss'+(masterMisses===1?'':' es')+' (+'+masterPenalty+'s penalty)';
 
  var bestTenths=getPR('master_'+selSet.key);
  var bestStr=bestTenths>0?fmtTime(bestTenths/10):'\u2014';
  document.getElementById('rec-wrap').innerHTML=isNew&&masterMisses===0?'<div class="rec-badge">&#127942; New record!</div>':isNew?'<div class="rec-badge">&#127942; New record! (with misses)</div>':'';
 
  var acc=Math.round((masterTotalQ/(masterTotalQ+masterMisses))*100);
  document.getElementById('rs1').textContent=acc+'%'; document.getElementById('rs1l').textContent='accuracy';
  document.getElementById('rs2').textContent=masterBest; document.getElementById('rs2l').textContent='best streak';
  document.getElementById('rs3').textContent=bestStr; document.getElementById('rs3l').textContent='best time';
 
  setMsg(stars,'master');
  animStars(stars);
  document.getElementById('again-btn').className='btn-p pur';
  document.getElementById('change-set-btn').style.display='';
  showScreen('results-screen');
}
 
function calcMasterStars(finalTime, misses, total) {
  // 3 stars: no misses, fast time (<= 1.5s/problem)
  // 2 stars: <=2 misses OR time <= 2.5s/problem
  // 1 star:  completed
  if (misses===0 && finalTime<=total*1.5) return 3;
  if (misses<=2  || finalTime<=total*2.5) return 2;
  return 1;
}

// ══════════════════════════════════════════
 
function setMsg(stars, mode) {
  var msgs={
    blitz: [['Keep going \u2014 every drill makes you faster!','Shake it off and try again!'],
            ['Good effort! Focus on accuracy for more points.','One star \u2014 keep drilling!'],
            ['Nice! Speed it up a bit for 3 stars.','Two stars! Push for that record.'],
            ['Outstanding! You crushed it! \ud83d\udd25','Three stars! Math machine! \u26a1']],
    master:[['Completed! Keep practicing to go faster.','You finished! Now go faster next time.'],
            ['Solid! Fewer misses = better time.','Getting there \u2014 aim for zero misses!'],
            ['Great time! One more push for 3 stars.','Almost perfect \u2014 so close!'],
            ['Flawless! Zero misses, fastest time! \ud83d\udd25','Perfect run! You mastered it! \u26a1']]
  };
  var pool=msgs[mode][stars];
  document.getElementById('res-msg').textContent=pool[randInt(0,pool.length-1)];
}
 
function animStars(stars) {
  document.getElementById('star1').className='big-star';
  document.getElementById('star2').className='big-star';
  document.getElementById('star3').className='big-star';
  if (stars>=1) setTimeout(function(){ document.getElementById('star1').className='big-star lit bounce'; },300);
  if (stars>=2) setTimeout(function(){ document.getElementById('star2').className='big-star lit bounce'; },650);
  if (stars>=3) setTimeout(function(){ document.getElementById('star3').className='big-star lit bounce'; },1000);
}

  if (selMode==='blitz') submitBlitz();
  else submitMaster();
}
 
document.getElementById('op-back').addEventListener('click',   function(){ showScreen('grade-screen'); });
document.getElementById('mode-back').addEventListener('click',  function(){ showScreen('op-screen'); });
document.getElementById('set-back').addEventListener('click',   function(){ showScreen('mode-screen'); });

});

document.getElementById('again-btn').addEventListener('click', function(){
  if (selMode==='blitz') startBlitz(); else startMaster();
});

document.getElementById('change-mode-btn').addEventListener('click', function(){ showScreen('mode-screen'); });

document.querySelector('.numpad').addEventListener('click', function(e){
  var btn=e.target.closest('.np'); if(!btn) return;
  var n=btn.getAttribute('data-n');
  var inp=document.getElementById('ans-input');
  if (n==='del') inp.value=inp.value.slice(0,-1);
  else if (n==='neg') { if(inp.value.charAt(0)!=='-') inp.value='-'+inp.value; }
  else inp.value=inp.value+n;
  inp.focus();
});
 
document.addEventListener('keydown', function(e){
  if (document.getElementById('game-screen').classList.contains('active') && e.key==='Enter') submitAnswer();
});
